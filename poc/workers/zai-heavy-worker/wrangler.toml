# zai-heavy-worker — receives delegated heavy commands (review, impact)
# from zai-main-worker via a Service Binding. Not exposed publicly.
name = "zai-heavy-worker"
main = "src/index.js"
compatibility_date = "2026-08-05"

[vars]
NODE_ENV = "production"
ZAI_MODEL = "glm-5.2"
R2_RETENTION_DAYS = "30"

# Production resources shared with zai-main-worker.
# Replace placeholder IDs before deploy.

# No public route: this worker is reached ONLY through the HEAVY_WORKER service
# binding from zai-main-worker (which works without any public URL). Disable the
# default workers.dev route so it has no public ingress at all.
workers_dev = false
[[d1_databases]]
binding = "BOT_DB"
database_name = "bot-db"
database_id = "2f6c5cd9-ec01-44ad-8ea8-fb1bb5523226"

[[r2_buckets]]
binding = "BOT_ARTIFACTS"
bucket_name = "bot-storage"

[[kv_namespaces]]
binding = "BOT_CACHE"
id = "a0fca8c009de4e57a0d241d5ebcaf055"

[[queues.consumers]]
queue = "bot-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true

[placement]
mode = "smart"

# Secrets — sourced from Cloudflare Secrets Store (NOT per-worker secrets).
# Same store as zai-main-worker (shared). `binding` = env var the code reads;
# `secret_name` = key inside the store.
# Store id: 629e5dd6594845a889e6ddabb26cc009
#   GITHUB_TOKEN           <- secret ZAI_GITHUB_TOKEN         (GitHub PAT for result comments)
#   ZAI_INTERNAL_TOKEN     <- secret ZAI_INTERNAL_TOKEN       (must match zai-main-worker)
#   ZAI_API_KEY            <- secret ZAI_API_KEY              (Z.ai key; used once review/impact call the LLM)
[[secrets_store_secrets]]
binding = "GITHUB_TOKEN"
store_id = "629e5dd6594845a889e6ddabb26cc009"
secret_name = "ZAI_GITHUB_TOKEN"

[[secrets_store_secrets]]
binding = "ZAI_INTERNAL_TOKEN"
store_id = "629e5dd6594845a889e6ddabb26cc009"
secret_name = "ZAI_INTERNAL_TOKEN"

[[secrets_store_secrets]]
binding = "ZAI_API_KEY"
store_id = "629e5dd6594845a889e6ddabb26cc009"
secret_name = "ZAI_API_KEY"
